# Content for the homepage sections. Edit here — no HTML required.

interests:
  - title: "Generative AI"
    icon: sparkles
    body: >-
      Theoretical foundations of generative modelling, and the geometry of
      generative trajectories — the paths along which generative models
      transport probability mass.
    tags: ["Flow Matching", "Diffusion Models", "Probability Paths"]

  - title: "Computational Photography"
    icon: camera
    body: >-
      Applying generative models to the camera pipeline: ISP-to-ISP style
      transfer, and the design of next-generation camera pipelines.
    tags: ["Camera ISP", "Style Transfer", "Low-Level Vision"]

  - title: "User-Preference-Driven Editing"
    icon: palette
    body: >-
      Image editing that follows what a person actually prefers, rather than
      the fixed aesthetic signature baked into their hardware.
    tags: ["Personal Color", "Image Editing", "Datasets"]

