# ==========================================================================
#  Site settings
# ==========================================================================

locale                   : "en-US"
title                    : "Taehyeon Kim"
title_separator          : "·"
name                     : &name "Taehyeon Kim"
description              : &description "Taehyeon Kim — undergraduate researcher in Generative AI and Computational Photography at Yonsei University."
url                      : https://taehyeon-k.github.io
baseurl                  : ""
repository               : "taehyeon-k/taehyeon-k.github.io"

# ==========================================================================
#  Author / profile
# ==========================================================================

author:
  name             : "Taehyeon Kim"
  avatar           : "/images/image.jpeg"
  role             : "AI Researcher"
  affiliation      : "B.S. in Artificial Intelligence, Yonsei University"
  lab              : "CIPLAB, Yonsei University"
  lab_url          : "https://www.ciplab.kr"
  location         : "Seoul, South Korea"
  email            : "taehyeon2006@yonsei.ac.kr"
  cv               : "/files/kimtaehyeon_CV.pdf"
  github           : "taehyeon-k"
  linkedin         : "태현-김-919806389"
  googlescholar    :   # e.g. https://scholar.google.com/citations?user=XXXX
  semantic         :
  orcid            :
  twitter          :

# ==========================================================================
#  Build
# ==========================================================================

markdown                 : kramdown
highlighter              : rouge
permalink                : /:categories/:title/
timezone                 : Asia/Seoul
future                   : true
words_per_minute         : 160
encoding                 : "utf-8"
markdown_ext             : "markdown,mkdown,mkdn,mkd,md"
excerpt_separator        : "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  style: compressed

include:
  - .htaccess
  - _pages
  - files

exclude:
  - .devcontainer
  - Dockerfile
  - docker-compose.yaml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - "*.sublime-project"
  - "*.sublime-workspace"

keep_files:
  - .git

# ==========================================================================
#  Collections
# ==========================================================================

collections:
  publications:
    output: true
    permalink: /publications/:path/
  blogs:
    output: true
    permalink: /blogs/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
  - scope:
      path: ""
      type: blogs
    values:
      layout: post
      read_time: true

# ==========================================================================
#  SEO
# ==========================================================================

og_image                 : "/images/image.jpeg"
google_site_verification :

# ==========================================================================
#  Plugins
# ==========================================================================

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

atom_feed:
  hide: false
