---
layout: default
---

<div class="wrap{% unless page.wide %} wrap--narrow{% endunless %} page-head">
  <h1 class="page-head__title">{{ page.title }}</h1>
  {%- if page.lede %}
    <p class="page-head__lede">{{ page.lede }}</p>
  {%- endif %}
</div>

{%- comment -%}
  `wide` pages (publication list, blog list, CV) lay out cards and embeds, so
  they opt out of the `prose` article typography rather than fighting it.
{%- endcomment -%}
<div class="wrap{% unless page.wide %} wrap--narrow prose{% endunless %} page-body">
  {{ content }}
</div>
